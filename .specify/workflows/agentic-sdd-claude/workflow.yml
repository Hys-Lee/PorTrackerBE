{
  "schema_version": "1.0",
  "workflow": {
    "id": "agentic-sdd-claude",
    "name": "agentic-sdd (claude)",
    "version": "0.1.0",
    "author": "agentic-dev",
    "description": "명세 → 설계 → 작업 목록 → 인수 시험 → 구현"
  },
  "requires": {
    "speckit_version": ">=0.8.5"
  },
  "inputs": {
    "spec": {
      "type": "string",
      "required": true
    },
    "feature": {
      "type": "string",
      "required": true
    },
    "design_author": {
      "type": "string",
      "default": "사람"
    },
    "task_guide": {
      "type": "string",
      "default": ""
    },
    "verdict_spec": {
      "type": "string",
      "required": false
    },
    "verdict_human_design": {
      "type": "string",
      "required": false
    },
    "verdict_design": {
      "type": "string",
      "required": false
    },
    "verdict_tasks": {
      "type": "string",
      "required": false
    },
    "verdict_acceptance": {
      "type": "string",
      "required": false
    }
  },
  "steps": [
    {
      "id": "specify",
      "command": "speckit.specify",
      "integration": "claude",
      "input": {
        "args": "폴더: specs/{{ inputs.feature }}\n{{ inputs.spec }}"
      },
      "model": "opus"
    },
    {
      "id": "check_specify",
      "type": "shell",
      "run": "test -s 'specs/{{ inputs.feature }}/spec.md'"
    },
    {
      "id": "review_spec",
      "type": "gate",
      "message": "명세를 읽고, 모름 절의 물음에 답을 채운 뒤 승인한다. 모름이 남으면 설계 명령에 그 목록을 내고 멈추라고 적혀 있다 — 명령 글의 부탁이라 안 지킬 수 있다.",
      "options": [
        "approve",
        "reject"
      ],
      "on_reject": "abort",
      "verdict_input": "verdict_spec",
      "show_file": "specs/{{ inputs.feature }}/spec.md"
    },
    {
      "id": "design_author",
      "type": "switch",
      "expression": "{{ inputs.design_author }}",
      "cases": {
        "사람": [
          {
            "id": "review_human_design",
            "type": "gate",
            "message": "설계 파일을 써 넣은 뒤 승인한다. AI 에게는 그 파일을 덮지 말고 빈 곳만 채우라고 적혀 있다 — 명령 글의 부탁이다.",
            "options": [
              "approve",
              "reject"
            ],
            "on_reject": "abort",
            "verdict_input": "verdict_human_design"
          }
        ]
      },
      "default": []
    },
    {
      "id": "plan",
      "command": "speckit.plan",
      "integration": "claude",
      "input": {
        "args": "폴더: specs/{{ inputs.feature }}"
      },
      "model": "opus"
    },
    {
      "id": "check_plan",
      "type": "shell",
      "run": "test -s 'specs/{{ inputs.feature }}/design.md'"
    },
    {
      "id": "review_design",
      "type": "gate",
      "message": "설계의 마일스톤을 확인하고 승인한다.",
      "options": [
        "approve",
        "reject"
      ],
      "on_reject": "abort",
      "verdict_input": "verdict_design",
      "show_file": "specs/{{ inputs.feature }}/design.md"
    },
    {
      "id": "tasks",
      "command": "speckit.tasks",
      "integration": "claude",
      "input": {
        "args": "폴더: specs/{{ inputs.feature }}\n{{ inputs.task_guide }}"
      },
      "model": "sonnet"
    },
    {
      "id": "check_tasks",
      "type": "shell",
      "run": "test -s 'specs/{{ inputs.feature }}/task.md'"
    },
    {
      "id": "review_tasks",
      "type": "gate",
      "message": "작업 목록을 확인하고 승인한다. 거절하면 구현하지 않고 끝난다.",
      "options": [
        "approve",
        "reject"
      ],
      "on_reject": "abort",
      "verdict_input": "verdict_tasks",
      "show_file": "specs/{{ inputs.feature }}/task.md"
    },
    {
      "id": "acceptance",
      "command": "speckit.acceptance",
      "integration": "claude",
      "input": {
        "args": "폴더: specs/{{ inputs.feature }}"
      },
      "model": "opus"
    },
    {
      "id": "check_acceptance",
      "type": "shell",
      "run": "test -s 'specs/{{ inputs.feature }}/acceptance.md'"
    },
    {
      "id": "review_acceptance",
      "type": "gate",
      "message": "인수 시험(명세의 사용 장면마다 어느 시험이 보나)을 확인하고, 시험 파일을 고칠 것이 있으면 고친 뒤 승인한다. 승인하면 흐름이 그 시험 파일들을 봉인한다 — 구현이 고치거나 지우면 검증 앞에서 흐름이 멈춘다. 거절하면 구현하지 않고 끝난다.",
      "options": [
        "approve",
        "reject"
      ],
      "on_reject": "abort",
      "verdict_input": "verdict_acceptance",
      "show_file": "specs/{{ inputs.feature }}/acceptance.md"
    },
    {
      "id": "check_acceptance_files",
      "type": "shell",
      "run": "test -s 'specs/{{ inputs.feature }}/acceptance-files.txt' && grep -v '^[[:space:]]*$' 'specs/{{ inputs.feature }}/acceptance-files.txt' | tr '\\n' '\\0' | xargs -0 shasum -a 256 > .specify/workflows/runs/{{ context.run_id }}/acceptance.sha && grep -v '^[[:space:]]*$' 'specs/{{ inputs.feature }}/acceptance-files.txt' | tar -cf .specify/workflows/runs/{{ context.run_id }}/acceptance.tar -T - && test -s .specify/workflows/runs/{{ context.run_id }}/acceptance.sha"
    },
    {
      "id": "implement_start",
      "type": "shell",
      "run": "n=$(grep -c '^- \\[ \\]' 'specs/{{ inputs.feature }}/task.md' || true); echo \"$n\" > .specify/workflows/runs/{{ context.run_id }}/implement-left"
    },
    {
      "id": "implement_loop",
      "type": "do-while",
      "condition": "{{ steps.check_implement.output.stdout | contains('left') }}",
      "max_iterations": 10,
      "steps": [
        {
          "id": "implement_need",
          "type": "shell",
          "run": "n=$(grep '^- \\[ \\]' 'specs/{{ inputs.feature }}/task.md' | grep -vc '— 못 돌림:' || true); if [ \"$n\" -gt 0 ]; then echo work; else echo none; fi"
        },
        {
          "id": "implement_if",
          "type": "if",
          "condition": "{{ steps.implement_need.output.stdout | contains('work') }}",
          "then": [
            {
              "id": "implement",
              "command": "speckit.implement",
              "integration": "claude",
              "input": {
                "args": "폴더: specs/{{ inputs.feature }}"
              },
              "model": "sonnet"
            }
          ]
        },
        {
          "id": "check_implement",
          "type": "shell",
          "run": "n=$(grep -c '^- \\[ \\]' 'specs/{{ inputs.feature }}/task.md' || true); f=.specify/workflows/runs/{{ context.run_id }}/implement-left; if [ \"$n\" -gt 0 ] && [ -f \"$f\" ] && [ \"$n\" -ge \"$(cat \"$f\")\" ]; then exit 1; fi; echo \"$n\" > \"$f\"; if [ \"$n\" -gt 0 ]; then echo left; else echo done; fi"
        }
      ]
    },
    {
      "id": "check_implement_left",
      "type": "shell",
      "run": "test \"$(grep -c '^- \\[ \\]' 'specs/{{ inputs.feature }}/task.md' || true)\" = 0"
    },
    {
      "id": "check_acceptance_intact",
      "type": "shell",
      "run": "shasum -a 256 -c .specify/workflows/runs/{{ context.run_id }}/acceptance.sha > /dev/null"
    },
    {
      "id": "verify",
      "type": "shell",
      "run": "( ./gradlew build ) > 'specs/{{ inputs.feature }}/verify.log' 2>&1"
    }
  ]
}
